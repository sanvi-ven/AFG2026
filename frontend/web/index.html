<body>
  <!--
    Text-only fallback for visitors and automated reviewers that do not execute
    JavaScript. Anchor is a Flutter web app, so every route's raw HTML is this
    same shell until the engine boots client-side. Without this block, a crawler
    fetching a real, meaningful URL (for example the client sign-up page named in
    our A2P 10DLC campaign's message flow) sees an empty page with no business
    name, no consent language, and no policy links. Keep the SMS consent sentence
    below byte-identical to the one rendered next to the phone field in
    frontend/lib/features/auth/presentation/client_signup_page.dart.
  -->
  <noscript>
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:720px;margin:0 auto;padding:32px 24px;color:#1a1a1a;line-height:1.55">
      <h1 style="font-size:1.5rem;margin:0 0 12px">Anchor &mdash; RP Landscaping</h1>
      <p>Anchor is the scheduling and account app operated by <strong>Ryan Prendergast, doing business as RP Landscaping</strong>, a landscaping and lawn care business serving Holden and Worcester, Massachusetts. Clients use it to request work, review estimates and invoices, and receive service reminders. Employees use it for scheduling and time tracking.</p>
      <p>This app needs JavaScript to run. The information below is provided in plain HTML so that it is readable without it.</p>

      <h2 style="font-size:1.15rem;margin:28px 0 8px">Text message program and consent</h2>
      <p>There are three separate places to opt in to text messages. None of them is required to create an account, submit a request, or use the app.</p>
      <p><strong>Clients</strong> opt in by creating an account at
        <a href="/signup/client">https://anchor-orpin.vercel.app/signup/client</a> and checking an
        unchecked-by-default, optional box next to the phone field reading:</p>
      <blockquote style="margin:0 0 14px;padding-left:14px;border-left:3px solid #ccc">&ldquo;I'd like to receive text message reminders about my appointments and invoices (optional). Message and data rates may apply. Reply STOP at any time to opt out.&rdquo;</blockquote>
      <p>A client can sign up, be scheduled, and be invoiced without ever checking it. Separately, the account cannot be created until the visitor checks a second, unrelated box &mdash; also unchecked by default &mdash; reading &ldquo;I agree to the Privacy Policy and Terms of Service,&rdquo; which is a condition of using the app, not of receiving texts. A client can change this preference at any time from their in-app Settings.</p>
      <p><strong>Employees</strong> of the business opt in the same way, by creating an invite-only account at
        <a href="/signup/employee">https://anchor-orpin.vercel.app/signup/employee</a> and checking an
        unchecked-by-default, optional box reading:</p>
      <blockquote style="margin:0 0 14px;padding-left:14px;border-left:3px solid #ccc">&ldquo;I'd like to receive text messages about my shifts, job assignments, and my employment contract (optional). Message and data rates may apply. Reply STOP at any time to opt out.&rdquo;</blockquote>
      <p>An employee can create an account and be scheduled without ever checking it, and can change this preference at any time from their in-app Settings.</p>
      <p><strong>Prospective customers</strong> who have not yet created an account can submit a public work-request form at
        <a href="/requests/new">https://anchor-orpin.vercel.app/requests/new</a>, which includes its own
        unchecked-by-default, optional box reading:</p>
      <blockquote style="margin:0 0 14px;padding-left:14px;border-left:3px solid #ccc">&ldquo;I'd like to receive text message updates about this request (optional). Message and data rates may apply. Reply STOP at any time to opt out.&rdquo;</blockquote>
      <p>Submitting the request form does not require checking this box.</p>
      <p>There is no verbal, paper, keyword or QR-code opt-in for any of the above. Messages are transactional only (appointment/estimate/invoice updates for clients, shift/job/contract updates for employees, and request-status updates for prospective customers) &mdash; there is no marketing or promotional texting. Message frequency varies with your own account/request activity. Reply <strong>STOP</strong> to any message to opt out, or <strong>HELP</strong> for help. Message and data rates may apply. The business owner's own phone number separately receives an internal alert when a new request comes in &mdash; an operational notification to the account holder about their own business, not a consumer opt-in.</p>
      <p><strong>No mobile information &mdash; including your phone number and your consent to receive text messages &mdash; is sold, shared, or disclosed to any third party or affiliate for marketing or promotional purposes, under any circumstances.</strong></p>

      <h2 style="font-size:1.15rem;margin:28px 0 8px">Policies</h2>

        <li><a href="/legal/privacy-policy.html">Privacy Policy</a></li>
        <li><a href="/legal/terms-of-service.html">Terms of Service</a></li>
        <li><a href="/legal/employee-data-notice.html">Employee Data Privacy Notice</a></li>
      </ul>

      <h2 style="font-size:1.15rem;margin:28px 0 8px">Contact</h2>
      <p>Ryan Prendergast, doing business as RP Landscaping<br>
        <a href="mailto:immc17289@gmail.com">immc17289@gmail.com</a><br>
        <a href="tel:+17745599448">774-559-9448</a><br>
        <a href="https://rplandscaping.org/">rplandscaping.org</a></p>
    </div>
  </noscript>
